name: Native Tray UI DPI proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full source commit SHA to build and test from this fork
        type: string
        required: true

permissions:
  contents: read

jobs:
  dpi-native-proof:
    name: Native Tray UI testhost DPI proof
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      OPENCLAW_CI_COLLECT_COVERAGE: 'false'
      OPENCLAW_REPO_ROOT: ${{ github.workspace }}
      OPENCLAW_TRAY_DATA_DIR: ${{ github.workspace }}\TestData\OpenClawTrayUITests
      OPENCLAW_TRAY_APPDATA_DIR: ${{ github.workspace }}\TestData\OpenClawTrayUITests-Roaming
      OPENCLAW_TRAY_LOCALAPPDATA_DIR: ${{ github.workspace }}\TestData\OpenClawTrayUITests-Local
    steps:
    - name: Validate exact source request
      shell: pwsh
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        REQUEST_REPOSITORY: ${{ github.repository }}
      run: |
        if ($env:REQUEST_REPOSITORY -cne 'TheAngryPit/openclaw-windows-node') {
          throw 'This proof is restricted to TheAngryPit/openclaw-windows-node.'
        }
        if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z') {
          throw 'source_sha must be a full 40-character lowercase commit SHA.'
        }

    - uses: actions/checkout@v7
      with:
        repository: TheAngryPit/openclaw-windows-node
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Record source and hosted runner identity
      shell: pwsh
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        $actual = (git rev-parse HEAD).Trim()
        if ($actual -cne $env:SOURCE_SHA) {
          throw "Requested source $($env:SOURCE_SHA) resolved to $actual."
        }
        New-Item -ItemType Directory -Force TestResults\Run | Out-Null
        [ordered]@{
          sourceSha = $env:SOURCE_SHA
          checkedOutSha = $actual
          repository = $env:GITHUB_REPOSITORY
          runnerEnvironment = $env:RUNNER_ENVIRONMENT
          imageOS = $env:ImageOS
          imageVersion = $env:ImageVersion
          eventName = $env:GITHUB_EVENT_NAME
          workflowSha = $env:GITHUB_SHA
        } | ConvertTo-Json | Set-Content -Encoding utf8 TestResults\Run\source.json
        Get-Content TestResults\Run\source.json

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Record .NET SDK
      shell: pwsh
      run: |
        dotnet --info 2>&1 | Tee-Object -FilePath TestResults\Run\dotnet-info.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore Tray UI test project
      shell: pwsh
      run: |
        dotnet restore tests/OpenClaw.Tray.UITests -r win-x64 2>&1 |
          Tee-Object -FilePath TestResults\Run\restore.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build Tray UI test project
      shell: pwsh
      run: |
        dotnet build tests/OpenClaw.Tray.UITests -c Debug -r win-x64 --no-restore 2>&1 |
          Tee-Object -FilePath TestResults\Run\build.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install matching Windows App Runtime
      shell: pwsh
      run: |
        Start-Transcript -Path TestResults\Run\runtime-install.log
        try {
          [xml]$props = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'Directory.Build.props')
          $versionNode = $props.SelectSingleNode('/Project/PropertyGroup/MicrosoftWindowsAppSDKVersion')
          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
            throw 'MicrosoftWindowsAppSDKVersion was not found in Directory.Build.props.'
          }
          $version = $versionNode.InnerText.Trim()
          $channel = [regex]::Match($version, '^\d+\.\d+').Value
          if ([string]::IsNullOrWhiteSpace($channel)) {
            throw "Cannot derive Windows App Runtime channel from '$version'."
          }
          $url = "https://aka.ms/windowsappsdk/$channel/$version/windowsappruntimeinstall-x64.exe"
          Write-Host "Installing Windows App Runtime $version."
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) { throw "Windows App Runtime install failed: $LASTEXITCODE" }
        }
        finally {
          Stop-Transcript
        }

    - name: Configure disposable hosted desktop
      shell: pwsh
      run: |
        ./scripts/Set-CiDesktopResolution.ps1 2>&1 | Tee-Object -FilePath TestResults\Run\desktop-setup.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run complete Tray UI test project
      shell: pwsh
      run: |
        ./scripts/Invoke-CiTest.ps1 `
          -Project tests/OpenClaw.Tray.UITests `
          -ResultsDirectory TestResults\TrayUI `
          -TrxFileName OpenClaw.Tray.UITests.trx `
          -Runtime win-x64 2>&1 |
          Tee-Object -FilePath TestResults\Run\tray-ui.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload source, build, DPI trace, and test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dpi-native-proof-${{ github.run_id }}-${{ github.run_attempt }}
        path: TestResults/
        if-no-files-found: warn
